<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AmneziaWG</title>
<link rel="preload" href="/static/font/TTInterfaces-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>
  /* Тему ставим до первой отрисовки, иначе тёмная страница успевает
     моргнуть светлой. */
  (() => {
    const saved = localStorage.getItem('theme');
    const dark = saved ? saved === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>

<div id="login" class="screen center hidden">
  <form id="login-form" class="login">
    <div class="mark" data-icon="shield" data-size="26"></div>
    <h1>AmneziaWG</h1>
    <p class="muted">Управление сервером</p>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit" class="primary">Войти</button>
    <div id="login-error" class="error"></div>
  </form>
</div>

<div id="app" class="screen hidden">
  <header>
    <div class="brand">
      <div class="mark" data-icon="shield" data-size="20"></div>
      <div class="who">
        <div class="title">AmneziaWG</div>
        <div class="sub muted" id="server-info">—</div>
      </div>
      <span class="badge-proto" id="proto-badge" title="">AWG</span>
      <span class="state down" id="iface-state"><span class="dot"></span><span id="iface-text">проверяем</span></span>
    </div>
    <div class="actions">
      <label class="search">
        <span class="ic" data-icon="search" data-size="16"></span>
        <input id="search" type="search" placeholder="Имя или адрес" autocomplete="off">
      </label>
      <button id="add-btn" class="primary"><span data-icon="plus" data-size="18"></span>Добавить</button>
      <button id="theme-btn" class="icon" title="Тема"></button>
      <button id="logout-btn" class="icon" title="Выйти"><span data-icon="logout" data-size="18"></span></button>
    </div>
  </header>

  <section class="stats">
    <div class="stat">
      <div class="badge" data-icon="users" data-size="18"></div>
      <div><div class="label">Клиентов</div><div class="value" id="s-total">0</div></div>
    </div>
    <div class="stat">
      <div class="badge" data-icon="wifi" data-size="18"></div>
      <div><div class="label">Онлайн</div><div class="value" id="s-online">0</div></div>
    </div>
    <div class="stat">
      <div class="badge" data-icon="down" data-size="18"></div>
      <div><div class="label">Принято</div><div class="value" id="s-rx">0</div>
        <div class="rate" id="s-rx-rate">—</div></div>
    </div>
    <div class="stat">
      <div class="badge" data-icon="up" data-size="18"></div>
      <div><div class="label">Отдано</div><div class="value" id="s-tx">0</div>
        <div class="rate" id="s-tx-rate">—</div></div>
    </div>
  </section>

  <main>
    <div id="empty" class="empty hidden">
      <div class="badge" data-icon="users" data-size="24"></div>
      Пока никого
    </div>
    <div id="rows" class="list"></div>
  </main>
</div>

<div id="create-modal" class="modal hidden">
  <form class="modal-card" id="create-form">
    <div class="modal-head"><b>Новый клиент</b>
      <button type="button" class="icon" data-close><span data-icon="close" data-size="16"></span></button></div>
    <label class="field">
      Имя устройства
      <input id="create-name" placeholder="iphone-artem" maxlength="120" required>
    </label>
    <div class="modal-foot">
      <button type="button" class="secondary" data-close>Отмена</button>
      <button type="submit" class="primary">Создать</button>
    </div>
  </form>
</div>

<div id="limits-modal" class="modal hidden">
  <form class="modal-card" id="limits-form">
    <div class="modal-head"><b id="limits-title">Лимит и срок</b>
      <button type="button" class="icon" data-close><span data-icon="close" data-size="16"></span></button></div>

    <div class="field">
      <div class="field-head">
        <span>Лимит трафика</span>
        <label class="switch"><input type="checkbox" id="limit-unlimited"><span>Безлимит</span></label>
      </div>
      <div class="pair">
        <input id="limit-value" type="number" min="0" step="0.5" placeholder="0">
        <select id="limit-unit">
          <option value="1073741824">ГБ</option>
          <option value="1099511627776">ТБ</option>
          <option value="1048576">МБ</option>
        </select>
      </div>
    </div>

    <div class="field">
      <div class="field-head">
        <span>Скорость</span>
        <label class="switch"><input type="checkbox" id="rate-unlimited"><span>Без ограничения</span></label>
      </div>
      <div class="pair">
        <input id="limit-rate" type="number" min="0" step="1" placeholder="0">
        <span class="unit">Мбит/с</span>
      </div>
    </div>

    <label class="field">
      Сбрасывать
      <select id="limit-period">
        <option value="none">не сбрасывать</option>
        <option value="day">раз в день</option>
        <option value="week">раз в неделю</option>
        <option value="month">раз в месяц</option>
        <option value="year">раз в год</option>
      </select>
    </label>

    <label class="field">
      Работает до
      <input id="limit-expires" type="date">
      <span class="hint">Пусто — бессрочно</span>
    </label>

    <div class="modal-foot">
      <button type="button" class="secondary" id="limit-reset">Обнулить счётчик</button>
      <button type="submit" class="primary">Сохранить</button>
    </div>
  </form>
</div>

<div id="usage-modal" class="modal hidden">
  <div class="modal-card wide">
    <div class="modal-head"><b id="usage-title">Расход</b>
      <button class="icon" data-close><span data-icon="close" data-size="16"></span></button></div>
    <div class="usage-legend">
      <span><i class="sw rx"></i>принято <b id="usage-rx">—</b></span>
      <span><i class="sw tx"></i>отдано <b id="usage-tx">—</b></span>
      <span class="muted" id="usage-total"></span>
    </div>
    <div id="usage-chart" class="chart"></div>
  </div>
</div>

<div id="qr-modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head"><b id="qr-name"></b>
      <button class="icon" data-close><span data-icon="close" data-size="16"></span></button></div>
    <div id="qr-body" class="qr"></div>
    <div class="modal-foot">
      <button class="secondary" id="qr-copy"><span data-icon="copy" data-size="16"></span>Скопировать</button>
      <a id="qr-download" class="button primary" download><span data-icon="download" data-size="16"></span>Скачать</a>
    </div>
  </div>
</div>

<div id="confirm-modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div style="display:flex;align-items:center;gap:12px">
        <span class="warn-badge" data-icon="alert" data-size="20"></span>
        <b id="confirm-title">Удалить?</b>
      </div>
      <button class="icon" data-close><span data-icon="close" data-size="16"></span></button>
    </div>
    <p id="confirm-text" class="muted" style="margin:0;font-size:15px"></p>
    <div class="modal-foot">
      <button class="secondary" data-close>Отмена</button>
      <button class="danger" id="confirm-ok">Удалить</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
